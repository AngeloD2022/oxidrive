[package]
name = "assgrave"
version = "0.1.0"
edition = "2024"

[dependencies]
lzma-sdk-sys = "0.1.1+24.09"
zip = "5.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
reqwest = { version = "0.12.23", features = ["json"] }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.41"